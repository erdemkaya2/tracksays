<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrackSays</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:'Inter',sans-serif;background:radial-gradient(circle at top,#1e293b,#020617);color:#e2e8f0}
.header{display:flex;justify-content:space-between;align-items:center;padding:20px 40px}
.header-right{display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:600}
.logo svg{width:48px;height:48px}

.auth button{margin-left:6px;padding:8px 14px;border-radius:8px;border:1px solid #38bdf8;background:transparent;color:#38bdf8;cursor:pointer}
.lang{display:flex;gap:6px}
.lang-btn{font-size:12px;color:#94a3b8;padding:4px 8px;border-radius:6px;cursor:pointer}
.lang-btn.active{background:#38bdf8;color:#020617}

.main{display:flex;gap:20px;padding:20px 40px}
.left{width:32%;background:rgba(30,41,59,0.6);border-radius:16px;padding:20px;max-height:70vh;overflow-y:auto}
.track{display:flex;justify-content:space-between;padding:10px;border-radius:8px;cursor:pointer}
.track:hover{background:rgba(56,189,248,0.1)}

.count{font-size:12px;color:#94a3b8}
.count strong{color:#38bdf8;font-size:14px}

.right{flex:1;background:rgba(51,65,85,0.9);border-radius:16px;padding:20px;max-height:70vh;overflow-y:auto}

.track-title{font-size:22px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center;font-weight:700;color:#38bdf8}

.actions{display:flex;gap:10px}
.primary-btn{background:#38bdf8;color:#020617;border:none;padding:6px 12px;border-radius:8px;font-weight:600;cursor:pointer}
.secondary-btn{font-size:12px;border:1px solid #38bdf8;background:transparent;color:#38bdf8;padding:4px 8px;border-radius:6px;cursor:pointer}

.comment{padding:15px;border-bottom:1px solid rgba(255,255,255,0.05);position:relative}
.comment-text{font-size:15px;margin-bottom:10px}
.meta{font-size:12px;color:#64748b}
.user{position:absolute;right:10px;bottom:5px;font-size:12px;color:#38bdf8}

.footer{text-align:center;padding:20px;font-size:12px;color:#64748b}

/* 🎯 SENİN İSTEDİĞİN TASARIM */
.track-name{font-weight:600;color:#e2e8f0}
.artist-name{font-size:12px;color:#94a3b8;margin-left:6px}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <svg viewBox="0 0 64 64" fill="none">
      <path d="M12 14C12 10 15 8 19 8H45C49 8 52 10 52 14V34C52 38 49 40 45 40H28L18 50V40H19C15 40 12 38 12 34V14Z" stroke="#38bdf8" stroke-width="2.5"/>
      <path d="M22 26V30M26 22V34M30 24V32M34 20V36M38 24V32M42 26V30" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    TrackSays
  </div>

  <div class="header-right">
    <div class="lang">
      <div class="lang-btn active" id="btn-en">EN</div>
      <div class="lang-btn" id="btn-tr">TR</div>
    </div>

    <div class="auth">
      <button id="signup">Sign Up</button>
      <button id="login">Log In</button>
    </div>
  </div>
</div>

<div style="display:flex;justify-content:center;margin-top:10px;">
  <input id="searchInput" placeholder="Search songs..." 
    style="width:400px;max-width:80%;padding:10px 14px;border-radius:10px;border:1px solid rgba(56,189,248,0.4);background:rgba(15,23,42,0.8);color:#e2e8f0;">
</div>

<div id="autocompleteBox" style="position:absolute;width:400px;max-width:80%;background:#0f172a;border-radius:10px;display:none;"></div>

<div class="main">
  <div class="left" id="trackList"></div>

  <div class="right">
    <div class="track-title">
      <span id="trackTitle"></span>
      <div class="actions">
        <button class="primary-btn" id="writeBtn">Write Comment</button>
        <button class="secondary-btn" id="showAllBtn">Show All</button>
      </div>
    </div>
    <div id="comments"></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){

let lang='en';

const tracks=[
"Wonderwall – Oasis","Şımarık – Tarkan","Aya Benzer – Mustafa Sandal","No Scrubs – TLC","Smells Like Teen Spirit – Nirvana",
"Losing My Religion – R.E.M.","I Want It That Way – Backstreet Boys","My Heart Will Go On – Celine Dion",
"Gia – Despina Vandi","Ti Mou Ekanes – Argiros","Viva La Vida – Coldplay","Fix You – Coldplay",
"Bohemian Rhapsody – Queen","Creep – Radiohead","Shape of You – Ed Sheeran","Nightcall – Kavinsky",
"Dudu – Tarkan","Wannabe – Spice Girls","Don’t Speak – No Doubt","Nothing Else Matters – Metallica"
];

const templates=[()=> "Harika vibe.",()=> "Efsane.",()=> "Bağımlılık yaptı.",()=> "Her dinleyişte farklı.",()=> "Nostalji vurdu."];

const userNames=["EgeKaan","LunaSky","MertAtlas","ZeynoWave","OrionX","DenizFlow","NovaPulse","ArdaStone","MilaEcho","KeremVibe","SelinAura","AtlasCore"];

const cache={}, userCache={}, dailyCounts={}, totalCounts={};

function generate(track){
 if(cache[track]) return cache[track];
 const total=Math.floor(Math.random()*1000)+200;
 totalCounts[track]=total;
 const arr=[];
 for(let i=0;i<total;i++){
   arr.push(templates[Math.floor(Math.random()*templates.length)]());
 }
 cache[track]=arr;
 return arr;
}

const trackList=document.getElementById('trackList');

function renderTrackList(){
 trackList.innerHTML='';
 tracks.forEach(t=>{
   const parts=t.split(" – ");
   const total=generate(t).length;
   const daily=Math.floor(Math.random()*30)+1;
   dailyCounts[t]=daily;

   const div=document.createElement('div');
   div.className='track';
   div.innerHTML=`
     <span>
       <span class="track-name">${parts[0]}</span>
       <span class="artist-name">– ${parts[1]}</span>
     </span>
     <span class="count"><strong>${daily}</strong> (${total})</span>
   `;
   div.onclick=()=>renderComments(t);
   trackList.appendChild(div);
 });
}

const comments=document.getElementById('comments');
const trackTitle=document.getElementById('trackTitle');

let showAll=false;
let currentPage=1;
const perPage=20;

function renderComments(track,page=1){
 currentPage=page;

 const parts=track.split(" – ");
 trackTitle.innerHTML=`
   <span class="track-name">${parts[0]}</span>
   <span class="artist-name">– ${parts[1]}</span>
 `;

 comments.innerHTML='';

 const all=generate(track);
 const limit=showAll?all.length:dailyCounts[track];
 const visible=all.slice(0,limit);

 const start=(page-1)*perPage;
 const pageData=visible.slice(start,start+perPage);

 pageData.forEach((c,i)=>{
   const idx=start+i;

   if(!userCache[track]) userCache[track]={};
   if(!userCache[track][idx]){
     userCache[track][idx]=userNames[Math.floor(Math.random()*userNames.length)];
   }

   const div=document.createElement('div');
   div.className='comment';
   div.innerHTML=`
     <div class="comment-text">${c}</div>
     <div class="meta">${idx+1}h ago</div>
     <div class="user">${userCache[track][idx]}</div>
   `;
   comments.appendChild(div);
 });

 renderPagination(track,visible.length);
}

function renderPagination(track,total){
 const totalPages=Math.ceil(total/perPage);
 const nav=document.createElement('div');

 for(let i=1;i<=totalPages;i++){
   const btn=document.createElement('button');
   btn.innerText=i;
   btn.style.margin='4px';
   btn.onclick=()=>renderComments(track,i);
   nav.appendChild(btn);
 }

 comments.appendChild(nav);
}

document.getElementById('showAllBtn').onclick=()=>{
 showAll=!showAll;
 renderComments(trackTitle.innerText || tracks[0],1);
};

renderTrackList();
renderComments(tracks[0]);

});
</script>

</body>
</html>
