<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrackSays</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:'Inter',sans-serif;background:radial-gradient(circle at top,#1e293b,#020617);color:#e2e8f0}
.header{display:flex;justify-content:space-between;align-items:center;padding:20px 40px}
.header-right{display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:600;text-decoration:none;color:#e2e8f0}
.logo svg{width:48px;height:48px}
.demo-tag{font-size:12px;color:#94a3b8;margin-left:6px}

.auth button{margin-left:6px;padding:8px 14px;border-radius:8px;border:1px solid #38bdf8;background:transparent;color:#38bdf8;cursor:pointer}
.lang{display:flex;gap:6px}
.lang-btn{font-size:12px;color:#94a3b8;padding:4px 8px;border-radius:6px;cursor:pointer}
.lang-btn.active{background:#38bdf8;color:#020617}

/* FIX 3: Sol liste daha dar */
.main{display:flex;gap:20px;padding:20px 40px}
.left{background:rgba(30,41,59,0.6);border-radius:16px;padding:16px;max-height:70vh;overflow-y:auto}
.track{display:flex;justify-content:space-between;padding:8px;border-radius:8px;cursor:pointer}
.track:hover{background:rgba(56,189,248,0.1)}

/* FIX 4: Sol listede font boyutunu küçült */
.track-name{
font-weight:600;
color:#e2e8f0;
font-size:14px; /* 👈 1 boyut büyüttük */
}
.artist-name{font-size:11px;color:#94a3b8;margin-left:4px}

.count{font-size:11px;color:#94a3b8}
.count strong{color:#38bdf8;font-size:12px}

.right{flex:1;background:rgba(51,65,85,0.9);border-radius:16px;padding:20px;max-height:70vh;overflow-y:auto}

.track-title{font-size:22px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center;font-weight:700;color:#38bdf8}

.actions{display:flex;gap:10px}
.primary-btn{background:#38bdf8;color:#020617;border:none;padding:6px 12px;border-radius:8px;font-weight:600;cursor:pointer}
.secondary-btn{font-size:12px;border:1px solid #38bdf8;background:transparent;color:#38bdf8;padding:4px 8px;border-radius:6px;cursor:pointer}

/* FIX 5: Yorumlar arası boşluğu azalt */
.comment{
padding:8px 12px;
margin-bottom:6px; /* 👈 EKLEDİK */
border-bottom:1px solid rgba(255,255,255,0.05);
position:relative;
}
.comment-text{
font-size:13px;
margin-bottom:6px;
line-height:1.5;
}

/* FIX 6: Meta (zaman) ve kullanıcı adı yan yana */
.comment-footer{display:flex;justify-content:flex-end;align-items:center;gap:8px;font-size:12px;color:#64748b}
.comment-footer .user{color:#38bdf8}

#comments .comment:nth-child(odd){
background: rgba(255,255,255,0.03);
}

#comments .comment:nth-child(even){
background: rgba(255,255,255,0.09);
}
.autocomplete-item{padding:8px 12px;cursor:pointer}
.autocomplete-item:hover,
.autocomplete-item.active{background:#1e293b}

mark{background:#38bdf8;color:#020617;border-radius:3px;padding:0 2px}
::-webkit-scrollbar {
width: 10px;
}

::-webkit-scrollbar-track {
background: #020617;
}

::-webkit-scrollbar-thumb {
background: #334155;
border-radius: 8px;
border: 2px solid #020617;
}

::-webkit-scrollbar-thumb:hover {
background: #38bdf8;
}
#comments button{
background: rgba(30,41,59,0.8);
color: #e2e8f0;
border: 1px solid rgba(56,189,248,0.3);
border-radius: 6px;
padding: 4px 8px;
margin: 2px;
cursor: pointer;
font-size: 12px;
transition: all 0.2s ease;
}

#comments button:hover{
background: #38bdf8;
color: #020617;
}

#comments button.active{
background: #38bdf8;
color: #020617;
font-weight: 600;
}

</style>
</head>
<body>

<div class="header">
  <!-- FIX 1: Logoya link -->
  <a href="https://www.tracksays.com" class="logo" target="_blank">
    <svg viewBox="0 0 64 64" fill="none">
      <path d="M12 14C12 10 15 8 19 8H45C49 8 52 10 52 14V34C52 38 49 40 45 40H28L18 50V40H19C15 40 12 38 12 34V14Z" stroke="#38bdf8" stroke-width="2.5"/>
      <path d="M22 26V30M26 22V34M30 24V32M34 20V36M38 24V32M42 26V30" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    TrackSays <span class="demo-tag">(Demo)</span>
  </a>

  <div class="header-right">
    <div class="lang">
      <div class="lang-btn active" id="btn-en">EN</div>
      <div class="lang-btn" id="btn-tr">TR</div>
    </div>

    <div class="auth">
      <button id="signup">Sign Up</button>
      <button id="login">Log In</button>
    </div>
  </div>
</div>

<div style="display:flex;justify-content:center;margin-top:10px;position:relative;">
  <input id="searchInput" placeholder="Search songs..." 
    style="width:400px;max-width:80%;padding:10px 14px;border-radius:10px;border:1px solid rgba(56,189,248,0.4);background:rgba(15,23,42,0.8);color:#e2e8f0;">
  <div id="autocompleteBox" style="position:absolute;top:42px;width:400px;max-width:80%;background:#0f172a;border-radius:10px;display:none;z-index:10;"></div>
</div>

<div class="main">
  <div style="display:flex;flex-direction:column;width:22%;gap:8px;">
    <div style="background:rgba(56,189,248,0.1);border:1px solid rgba(56,189,248,0.3);border-radius:12px;padding:10px 16px;text-align:center;">
      <span style="font-size:13px;font-weight:600;color:#38bdf8;letter-spacing:1px;text-transform:uppercase;">Şarkılar</span>
    </div>
    <div class="left" id="trackList" style="width:100%;box-sizing:border-box;"></div>
  </div>

  <div class="right">
    <div class="track-title">
      <span id="trackTitle"></span>
      <div class="actions">
        <button class="primary-btn" id="writeBtn">Write Comment</button>
        <!-- FIX 2: Toggle butonu başlangıçta "Show All" -->
        <button class="secondary-btn" id="showAllBtn">Show All</button>
      </div>
    </div>
    <div id="comments"></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){

let lang='en';

// FIX 2: showAll başlangıçta false = son 24 saat görünümü
let showAll=false;

const tracks=[
"Wonderwall – Oasis","Şımarık – Tarkan","Aya Benzer – Mustafa Sandal","No Scrubs – TLC","Smells Like Teen Spirit – Nirvana",
"Losing My Religion – R.E.M.","I Want It That Way – Backstreet Boys","My Heart Will Go On – Celine Dion",
"Gia – Despina Vandi","Ti Mou Ekanes – Argiros","Viva La Vida – Coldplay","Fix You – Coldplay",
"Bohemian Rhapsody – Queen","Creep – Radiohead","Shape of You – Ed Sheeran","Nightcall – Kavinsky",
"Dudu – Tarkan","Wannabe – Spice Girls","Don't Speak – No Doubt","Nothing Else Matters – Metallica"
];

/* GELİŞMİŞ YORUM MOTORU */

const starters=[
"Bu şarkının en ilginç tarafı",
"Her dinlediğimde fark ettiğim şey",
"Garip bir şekilde",
"İlk başta çok dikkat etmemiştim ama",
"Yıllar geçse de değişmeyen şey",
"Bilmiyorum sadece bana mı oluyor ama"
];

const middles=[
"insanın ruh haline göre tamamen başka bir şeye dönüşmesi",
"arka plandaki detayların aslında çok daha zengin olması",
"vokalin verdiği hissin beklenenden çok daha yoğun olması",
"basit gibi başlayıp katman katman açılması",
"melodinin bilinçaltına direkt işlemesi",
"dinledikçe farklı detaylar yakalaman"
];

const endings=[
"ve bu yüzden tekrar tekrar açıyorum.",
"insanı istemeden içine çekiyor.",
"bence bu yüzden yıllardır eskimiyor.",
"her dinleyişte başka bir şey veriyor.",
"bir noktadan sonra bağımlılık yapıyor."
];

const extras=[
"",
" Küçük bir detay ama prodüksiyon inanılmaz temiz.",
" Çoğu kişi bu kısmı fark etmiyor bile.",
" Sözler ayrıca analiz edilecek seviyede.",
" Canlı performansı stüdyodan bile daha iyi."
];

function pick(arr){
return arr[Math.floor(Math.random()*arr.length)];
}

function generateComment(){
return `${pick(starters)} ${pick(middles)} ve ${pick(endings)}${pick(extras)}`;
}

const userNames=["EgeKaan","LunaSky","MertAtlas","ZeynoWave","OrionX","DenizFlow","NovaPulse","ArdaStone","MilaEcho","KeremVibe","SelinAura","AtlasCore"];

const cache={}, userCache={}, dailyCounts={}, totalCounts={};

function generate(track){
 if(cache[track]) return cache[track];
 const total=Math.floor(Math.random()*1000)+200;
 totalCounts[track]=total;
 const arr=[];
 for(let i=0;i<total;i++){
   arr.push(generateComment());
 }
 cache[track]=arr;
 return arr;
}

const trackList=document.getElementById('trackList');

function renderTrackList(){
 trackList.innerHTML='';
 tracks.forEach(t=>{
   const parts=t.split(" – ");
   const total=generate(t).length;
   const daily=Math.floor(Math.random()*30)+1;
   dailyCounts[t]=daily;

   const div=document.createElement('div');
   div.className='track';
   div.innerHTML=`
     <span class="track-name">${parts[0]}</span>
     <span class="count"><strong>${daily}</strong> (${total})</span>
   `;
   div.onclick=()=>renderComments(t);
   trackList.appendChild(div);
 });
}

/* AUTOCOMPLETE */
const searchInput=document.getElementById('searchInput');
const autocompleteBox=document.getElementById('autocompleteBox');

let activeIndex=-1;
let currentMatches=[];

searchInput.addEventListener('input',()=>{
 const val=searchInput.value.toLowerCase();
 activeIndex=-1;

 if(val===""){
   autocompleteBox.style.display="none";
   return;
 }

 currentMatches=tracks.filter(t=>t.toLowerCase().includes(val)).slice(0,5);

 autocompleteBox.innerHTML="";

 currentMatches.forEach((m,i)=>{
   const div=document.createElement('div');
   div.className="autocomplete-item";

   const regex=new RegExp(`(${val})`,'gi');
   div.innerHTML=m.replace(regex,'<mark>$1</mark>');

   div.onclick=()=>{
     selectItem(i);
   };

   autocompleteBox.appendChild(div);
 });

 autocompleteBox.style.display="block";
});

function selectItem(i){
 const val=currentMatches[i];
 searchInput.value=val;
 autocompleteBox.style.display="none";
 renderComments(val);
}

searchInput.addEventListener('keydown',(e)=>{
 const items=document.querySelectorAll('.autocomplete-item');

 if(e.key==="ArrowDown"){
   activeIndex++;
   if(activeIndex>=items.length) activeIndex=0;
 }

 if(e.key==="ArrowUp"){
   activeIndex--;
   if(activeIndex<0) activeIndex=items.length-1;
 }

 if(e.key==="Enter" && activeIndex>-1){
   selectItem(activeIndex);
 }

 if(e.key==="Escape"){
   autocompleteBox.style.display="none";
 }

 items.forEach(el=>el.classList.remove('active'));
 if(items[activeIndex]) items[activeIndex].classList.add('active');
});

/* outside click */
document.addEventListener('click',(e)=>{
 if(!searchInput.contains(e.target) && !autocompleteBox.contains(e.target)){
   autocompleteBox.style.display="none";
 }
});

/* LANGUAGE */
const writeBtn=document.getElementById('writeBtn');
const showAllBtn=document.getElementById('showAllBtn');

document.getElementById('btn-en').onclick=()=>{lang='en';toggleLangUI();}
document.getElementById('btn-tr').onclick=()=>{lang='tr';toggleLangUI();}

function updateToggleBtn(){
 // FIX 2: showAll=false ise "Show All" göster, true ise "Last 24h" göster
 if(lang==='tr'){
   showAllBtn.innerText=showAll ? 'Son 24 Saat' : 'Tümünü Göster';
 } else {
   showAllBtn.innerText=showAll ? 'Last 24h' : 'Show All';
 }
}

function toggleLangUI(){
 document.getElementById('btn-en').classList.toggle('active',lang==='en');
 document.getElementById('btn-tr').classList.toggle('active',lang==='tr');

 if(lang==='tr'){
   searchInput.placeholder="Şarkı ara...";
   writeBtn.innerText="Yorum Yaz";
 }else{
   searchInput.placeholder="Search songs...";
   writeBtn.innerText="Write Comment";
 }
 updateToggleBtn();
}

/* COMMENTS */
const comments=document.getElementById('comments');
const trackTitle=document.getElementById('trackTitle');

let currentPage=1;
const perPage=20;
let currentTrack=null;

function renderComments(track,page=1){
 currentTrack=track;
 currentPage=page;

 const parts=track.split(" – ");
 trackTitle.innerHTML=`
   <span style="font-size:28px;font-weight:800;color:#38bdf8;letter-spacing:-0.5px;">${parts[0]}</span>
 `;

 comments.innerHTML='';

 const all=generate(track);
 const limit=showAll ? all.length : dailyCounts[track];
 const visible=all.slice(0,limit);

 const start=(page-1)*perPage;
 const pageData=visible.slice(start,start+perPage);

 pageData.forEach((c,i)=>{
   const idx=start+i;

   if(!userCache[track]) userCache[track]={};
   if(!userCache[track][idx]){
     userCache[track][idx]=userNames[Math.floor(Math.random()*userNames.length)];
   }

   const div=document.createElement('div');
   div.className='comment';
   // FIX 6: Zaman ve kullanıcı adı yan yana, footer'da
   div.innerHTML=`
     <div class="comment-text">${c}</div>
     <div class="comment-footer">
       <span class="meta">${idx+1}h ago</span>
       <span class="user">${userCache[track][idx]}</span>
     </div>
   `;
   comments.appendChild(div);
 });

 renderPagination(track,visible.length);
}

function renderPagination(track,total){
const totalPages=Math.ceil(total/perPage);

/* 👇 KRİTİK KONTROL */
if(totalPages <= 1){
return; // pagination hiç oluşturulmaz
}
 const nav=document.createElement('div');

 for(let i=1;i<=totalPages;i++){
   const btn=document.createElement('button');
   btn.innerText=i;
   btn.style.margin='4px';
   btn.onclick=()=>renderComments(track,i);
   nav.appendChild(btn);
 }

 comments.appendChild(nav);
}

// FIX 2: Toggle logic
showAllBtn.onclick=()=>{
 showAll=!showAll;
 updateToggleBtn();
 if(currentTrack){
   renderComments(currentTrack,1);
 }
};

renderTrackList();
renderComments(tracks[0]);
updateToggleBtn();

});
</script>

</body>
</html>
