<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackSays - Coming Soon</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 64 64' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='64' height='64' rx='12' fill='%230f172a'/%3E%3Cpath d='M12 14C12 10 15 8 19 8H45C49 8 52 10 52 14V34C52 38 49 40 45 40H28L18 50V40H19C15 40 12 38 12 34V14Z' stroke='%2338bdf8' stroke-width='2.5'/%3E%3Cpath d='M22 26V30M26 22V34M30 24V32M34 20V36M38 24V32M42 26V30' stroke='%2338bdf8' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { margin:0; font-family:'Inter',sans-serif; background:radial-gradient(circle at top,#1e293b,#020617); color:#e2e8f0; display:flex; align-items:center; justify-content:center; height:100vh; overflow:hidden; }

    .lang-toggle{position:absolute;top:20px;right:30px;display:flex;background:rgba(30,41,59,0.8);border-radius:999px;overflow:hidden;border:1px solid rgba(255,255,255,0.1)}
    .lang-btn{padding:8px 14px;cursor:pointer;font-size:13px;color:#94a3b8;transition:.3s}
    .lang-btn.active{background:#38bdf8;color:#020617;font-weight:600}

    .container{text-align:center;max-width:700px;padding:20px;animation:fadeIn 1.5s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

    .brand{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      margin-bottom:10px;
    }

    .brand svg{
      width:48px;
      height:48px;
    }

    .brand span{
      font-size:48px;
      font-weight:600;
      letter-spacing:-1px;
      background:linear-gradient(90deg,#38bdf8,#0ea5e9);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    h2{font-weight:300;color:#94a3b8;margin-bottom:30px}

    .entry-box{background:rgba(30,41,59,0.6);padding:14px 20px;border-radius:16px;margin-top:10px;min-height:60px;transition:opacity .6s ease}
    .entry-box.fade{opacity:0}

    .entry-text{font-size:16px;line-height:1.5;white-space:pre-line}
    .track{font-size:13px;color:#38bdf8;margin-bottom:8px}

    .cta{margin-top:30px;font-size:14px;color:#94a3b8}
    .cta strong{color:#38bdf8}

    .demo-btn{
      display:inline-block;
      padding:10px 20px;
      background:#38bdf8;
      color:#020617;
      border-radius:999px;
      font-size:13px;
      font-weight:600;
      text-decoration:none;
      transition:.3s;
    }

    .demo-btn:hover{
      background:#0ea5e9;
      transform:translateY(-1px);
    }

    .pulse{position:absolute;width:300px;height:300px;background:radial-gradient(circle,rgba(56,189,248,0.15),transparent);border-radius:50%;animation:pulse 4s infinite}
    @keyframes pulse{0%{transform:scale(.9);opacity:.6}50%{transform:scale(1.2);opacity:.2}100%{transform:scale(.9);opacity:.6}}
  </style>
</head>
<body>

<div class="lang-toggle">
  <div class="lang-btn active" onclick="setLang('en')">EN</div>
  <div class="lang-btn" onclick="setLang('tr')">TR</div>
</div>

<div class="pulse"></div>

<div class="container">

  <div class="brand">
    <svg viewBox="0 0 64 64" fill="none">
      <path d="M12 14C12 10 15 8 19 8H45C49 8 52 10 52 14V34C52 38 49 40 45 40H28L18 50V40H19C15 40 12 38 12 34V14Z" stroke="#38bdf8" stroke-width="2.5"/>
      <path d="M22 26V30M26 22V34M30 24V32M34 20V36M38 24V32M42 26V30" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <span>TrackSays</span>
  </div>

  <h2 id="subtitle">
    <span id="mainLine">Songs speak. People write.</span><br>
    <span id="subLine" style="font-size:16px; color:#64748b;">What do you hear?</span>
  </h2>

  <div class="entry-box" id="box">
    <div class="track" id="track"></div>
    <div class="entry-text" id="entry"></div>
  </div>

  <div class="cta" id="cta">
    Be among the first to leave your mark on music. <br>
    <strong>Launching soon.</strong><br>
    <span style="font-size:12px; color:#64748b;">
      A full version will be made available in the near future.
    </span>
    <div style="margin-top:20px;">
      <a href="demo.html" class="demo-btn">Access Demo</a>
    </div>
  </div>
</div>

<script>
const entries = {
  en: [
    {track:"Wonderwall – Oasis", text:"Feels like a memory you never actually lived, but somehow miss."},
    {track:"Smells Like Teen Spirit – Nirvana", text:"Raw energy that never gets old."},
    {track:"Losing My Religion – R.E.M.", text:"Confusion and obsession in one loop."},
    {track:"I Want It That Way – Backstreet Boys", text:"You don't question it, you just sing along."},
    {track:"My Heart Will Go On – Celine Dion", text:"Dramatic, emotional, unforgettable."},
    {track:"Şımarık – Tarkan", text:"Playful, iconic, and impossible not to smile."},
    {track:"Aya Benzer – Mustafa Sandal", text:"Light, catchy, like a summer night."},
    {track:"Gia – Despina Vandi", text:"Pure energy with a touch of attitude."},
    {track:"Bohemian Rhapsody – Queen", text:"Chaos, but somehow perfect."}
  ],
  tr: [
    {track:"Wonderwall – Oasis", text:"Hiç yaşamadığın ama özlüyormuş gibi hissettiren bir anı."},
    {track:"Smells Like Teen Spirit – Nirvana", text:"Eskimeyen saf enerji."},
    {track:"Losing My Religion – R.E.M.", text:"Kafa karışıklığı ve takıntının birleşimi."},
    {track:"I Want It That Way – Backstreet Boys", text:"Sorgulamazsın, sadece eşlik edersin."},
    {track:"My Heart Will Go On – Celine Dion", text:"Dramatik, duygusal, unutulmaz."},
    {track:"Şımarık – Tarkan", text:"90'lar Türk popunun en saf hali."},
    {track:"Aya Benzer – Mustafa Sandal", text:"Yaz gecesi gibi hafif ve akılda kalıcı."},
    {track:"Gia – Despina Vandi", text:"Enerji ve tavrın birleşimi."},
    {track:"Bohemian Rhapsody – Queen", text:"Kaos ama mükemmel."}
  ]
};

let currentLang = 'en';
let index = 0;

function rotateEntries(){
  const box = document.getElementById('box');
  box.classList.add('fade');

  setTimeout(()=>{
    const data = entries[currentLang];
    document.getElementById('track').innerText = data[index].track;
    document.getElementById('entry').innerText = '"' + data[index].text + '"';
    index = (index + 1) % data.length;
    box.classList.remove('fade');
  }, 300);
}

setInterval(rotateEntries, 4000);
rotateEntries();

function setLang(lang){
  currentLang = lang;
  index = 0;
  document.querySelectorAll('.lang-btn').forEach(btn=>btn.classList.remove('active'));

  if(lang==='tr'){
    document.querySelectorAll('.lang-btn')[1].classList.add('active');
    document.getElementById('mainLine').innerText="Şarkılar konuşur. İnsanlar yazar.";
    document.getElementById('subLine').innerText="Sen ne duyuyorsun?";
    document.getElementById('cta').innerHTML=
      "Müzikte izini bırakan ilk kişilerden biri ol.<br><strong>Çok yakında.</strong><br>" +
      "<span style='font-size:12px; color:#64748b;'>Tam sürüm kısa süre içerisinde kullanıma sunulacaktır.</span>" +
      "<div style='margin-top:20px;'><a href='demo.html' class='demo-btn'>Demo'yu İncele</a></div>";
  }else{
    document.querySelectorAll('.lang-btn')[0].classList.add('active');
    document.getElementById('mainLine').innerText="Songs speak. People write.";
    document.getElementById('subLine').innerText="What do you hear?";
    document.getElementById('cta').innerHTML=
      "Be among the first to leave your mark on music.<br><strong>Launching soon.</strong><br>" +
      "<span style='font-size:12px; color:#64748b;'>A full version will be made available in the near future.</span>" +
      "<div style='margin-top:20px;'><a href='demo.html' class='demo-btn'>Access Demo</a></div>";
  }

  rotateEntries();
}
</script>

</body>
</html>
